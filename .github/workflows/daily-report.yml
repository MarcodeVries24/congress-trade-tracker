name: Send daily ingest report

on:
  # Once a day, not after every 4-hourly ingest.yml run — rolls up all six
  # of that day's runs into one email. Reports on *yesterday's* filings
  # (filing_date, not when our pipeline happened to touch the row — see
  # sendDailyReport.ts), so this runs early — just after the first ingest
  # run of the new day (17 */4 * * * → 00:17 UTC) — rather than late in the
  # *same* day, since by then all six of yesterday's runs already had their
  # chance to see anything filed yesterday.
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC daily
  workflow_dispatch: {}

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run send-daily-report --workspace ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
