name: Ingest House PTR filings

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run sync-members --workspace ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: npm run ingest --workspace ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
