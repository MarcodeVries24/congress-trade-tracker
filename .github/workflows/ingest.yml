name: Ingest Congress PTR filings

on:
  # Off the hour on purpose — GitHub queues everyone's on-the-hour cron
  # jobs together, which can delay a run by 1-2+ hours during busy periods.
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # efdsearch.senate.gov (Akamai) blocks Playwright's bundled Chromium
      # outright but not a real Chrome build — see ingest/src/ingest/senate/
      # browser.ts. `playwright install chrome` is Playwright's own
      # provisioning path for the "chrome" channel (as opposed to
      # `install chromium`, the bundled build) — needed so
      # chromium.launch({ channel: "chrome" }) has something to find.
      - run: npx playwright install --with-deps chrome
        working-directory: ingest

      - run: npm run sync-members --workspace ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: npm run ingest --workspace ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: npm run ingest-senate --workspace ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Emails CongTrade Pro subscribers whose saved alerts match anything
      # that just arrived. Last step on purpose — both chambers are already
      # in, so a filing found this cycle goes out in this cycle.
      #
      # Safe to have here before alerts are switched on: with no
      # ALERT_FROM_EMAIL set, the job prints why and exits 0 without sending
      # (Resend's sandbox sender can only deliver to the account owner, so
      # real user mail needs a verified domain first — see README).
      - run: npm run alerts:send --workspace ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Lets the sender re-check that each alert's owner still holds
          # CongTrade Pro. Without it nothing breaks — every alert is treated
          # as entitled and it says so in the log (see entitlements.ts).
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
