name: Ingest Congress PTR filings

on:
  # Off the hour on purpose — GitHub queues everyone's on-the-hour cron
  # jobs together, which can delay a run by 1-2+ hours during busy periods.
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run ingest --workspace ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Matches this run's new filings to their member, after the ingest so
      # they are matched in the same run. --new-only: the full members sync
      # (photos, histories, re-checking every filing) runs daily in
      # daily-sync.yml; it read every filing, which after every ingest was a
      # large part of the database's monthly network transfer.
      - run: npm run sync-members --workspace ingest -- --new-only
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Senate reports saved by hand and uploaded in /admin/senate. Since
      # 23 Oct 2026 efdsearch.senate.gov's bot protection turns the automated
      # search (ingest-senate, runSenate.ts) away, and getting past a bot
      # check is not something this project does, so a person opens the new
      # reports and this reads the saved pages, never contacting eFD. The
      # automated search stays in the repo for if the Senate grants access.
      # Chrome reads the Senate report pages uploaded in /admin/senate
      # (import-senate-uploads below), offline. `playwright install chrome`
      # provisions the "chrome" channel that chromium.launch({ channel:
      # "chrome" }) looks for.
      #
      # Installed here, after the House ingest, not at the top: it pulls
      # system packages from Ubuntu's mirrors, and when those are unreachable
      # (as on 11 Nov 2026) it used to skip the members sync and the House
      # ingest along with it. Now a mirror outage costs only the Senate
      # import, and the timeout stops it waiting ten minutes on DNS.
      - run: npx playwright install --with-deps chrome
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        working-directory: ingest

      - run: npm run import-senate-uploads --workspace ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Company names from the SEC's public ticker list, so a ticker that
      # arrived in this run is named straight away. --new-only: just tickers
      # with no row yet; the full pass (renamed companies) runs daily in
      # daily-sync.yml. An enrichment like the one above: never fails the
      # ingest.
      - run: npm run sync-company-names --workspace ingest -- --new-only
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Daily closes for trades that just arrived: the close on each new
      # trade date, so the trade page and "before the public knew" have it
      # within this cycle. Only tickers with something unpriced are asked
      # about (usually a handful); the close on a disclosure day that has not
      # ended yet, and every ticker's latest close, come from the nightly
      # run in prices.yml. An enrichment, so a failure never fails the ingest.
      - run: npm run sync-prices:new --workspace ingest
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Market caps for tickers that just arrived: shares outstanding from
      # the SEC times the close fetched in the step above, so it runs after
      # it. One small SEC request per genuinely new company, usually none;
      # the monthly run in market-caps.yml refreshes every cap. An
      # enrichment, so a failure never fails the ingest.
      - run: npm run sync-market-caps:missing --workspace ingest
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Emails CongTrade Pro subscribers whose saved alerts match anything
      # that just arrived. Last step on purpose — both chambers are already
      # in, so a filing found this cycle goes out in this cycle.
      #
      # This and the enrichment steps above run even when a chamber's step
      # failed (`!cancelled()`): the job still ends red, but one chamber's
      # site being down never holds back the other chamber's trades.
      #
      # Safe to have here before alerts are switched on: with no
      # ALERT_FROM_EMAIL set, the job prints why and exits 0 without sending
      # (Resend's sandbox sender can only deliver to the account owner, so
      # real user mail needs a verified domain first — see README).
      - run: npm run alerts:send --workspace ingest
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Lets the sender re-check that each alert's owner still holds
          # CongTrade Pro. Without it nothing breaks — every alert is treated
          # as entitled and it says so in the log (see entitlements.ts).
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
