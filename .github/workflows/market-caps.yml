name: Sync market caps

on:
  # Monthly, not every-4-hours like ingest.yml: a company's share count
  # changes at most once a quarter. Shares come from the SEC and the price
  # from the nightly prices sync (see syncMarketCaps.ts).
  schedule:
    - cron: "30 5 1 * *" # 1st of the month, 05:30 UTC
  workflow_dispatch: {}

jobs:
  sync-market-caps:
    runs-on: ubuntu-latest
    # A few thousand small SEC requests at under 10 a second.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run sync-market-caps --workspace ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
